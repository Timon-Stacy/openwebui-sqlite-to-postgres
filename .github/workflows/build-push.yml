name: Build and publish migrator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - migrate_sqlite_to_pg.py
      - openwebui-migrate.sh
      - .github/workflows/build-push.yml

concurrency:
  group: openwebui-sqlite-to-postgres-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          bash -n openwebui-migrate.sh
          python3 -m py_compile migrate_sqlite_to_pg.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/openwebui-sqlite-to-postgres"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ci_tag=${image}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${image}:5233057" >> "$GITHUB_OUTPUT"
          echo "commit_tag=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build local test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.ci_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/systemgroupnet/openwebui-sqlite-to-postgres
            org.opencontainers.image.revision=5233057f623a709eef1d6e56e96aa137ad961bea
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Smoke test entrypoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.meta.outputs.ci_tag }}" help

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ci_tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish immutable image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.source_tag }}
            ${{ steps.meta.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/systemgroupnet/openwebui-sqlite-to-postgres
            org.opencontainers.image.revision=5233057f623a709eef1d6e56e96aa137ad961bea
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=migrator

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Published migration image"
            echo
            echo '```text'
            echo "${{ steps.meta.outputs.image }}@${{ steps.publish.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
